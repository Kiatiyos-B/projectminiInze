<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>อัปโหลดไฟล์</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #FFF1F0, #FFEAE5);
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    form {
      background-color: #ffffff;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
    }

    h2 {
      margin-bottom: 20px;
      color: #c42d14;
      font-size: 24px;
      text-align: center;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 18px;
      color: #444;
    }

    input[type="text"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
    }

    input[type="submit"] {
      background-color: #FF6B6B;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      margin-top: 25px;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s ease-in-out;
    }

    input[type="submit"]:hover {
      background-color: #e85757;
    }

    ::file-selector-button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background-color: #FF6B6B;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form action="/upload" method="POST" enctype="multipart/form-data" id="uploadForm">
    <h2>📤 ฟอร์มอัปโหลดไฟล์</h2>

    <label for="name">📄 รุ่น:</label>
    <input type="text" name="name" required>

    <label for="file">📁 เลือกไฟล์ (ชื่อไฟล์ต้องเป็นภาษาอังกฤษเท่านั้น):</label>
    <input type="file" name="file" id="file" required>

    <label for="comment">📝 หมายเหตุ:</label>
    <textarea name="comment" rows="4" placeholder="กรอกข้อมูลเพิ่มเติม (ถ้ามี)"></textarea>

    <input type="submit" value="🚀 อัปโหลด">
  </form>

  <script>
    document.getElementById('file').addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const validNamePattern = /^[A-Za-z0-9_.- ()]+$/;
        if (!validNamePattern.test(file.name)) {
          alert('❌ ชื่อไฟล์ต้องเป็นภาษาอังกฤษเท่านั้น (ห้ามมีช่องว่างหรืออักขระพิเศษ)');
          this.value = '';
        }
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการไฟล์ INZY</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(to right, #fff5f2, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    img.logo {
      width: 140px;
      margin-bottom: 25px;
    }

    h2 {
      color: #e5391d;
      margin-bottom: 10px;
      font-weight: 600;
    }

    p {
      color: #444;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    button {
      background-color: #e5391d;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #c42d14;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="inzy-logo.png" alt="INZY Logo" class="logo">
    <h2>ระบบจัดการไฟล์ INZY</h2>
    <p>กรุณาเลือกเมนูที่คุณต้องการ</p>

    <div class="button-group">
      <button onclick="window.location.href='/form'">📤 อัปโหลดเอกสาร</button>
      <button onclick="window.location.href='/pview-file'">📄 ดูรายการเอกสาร</button>
      <button onclick="window.location.href='/problem'">📄 AI </button>
    </div>

    <div class="footer">
      &copy; 2025 บริษัท INZY จำกัด
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI ช่วยแก้ปัญหา</title>
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background: #fdf2ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    h2 {
      color: #e5391d;
      margin-bottom: 20px;
    }
    input, textarea {
      width: 100%;
      max-width: 600px;
      font-size: 16px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    button {
      background-color: #e5391d;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      margin-top: 20px;
      cursor: pointer;
    }
    button:hover {
      background-color: #c53017;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      background-color: #fff;
      border-left: 5px solid #e5391d;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
    }
    .result h3 {
      margin-top: 0;
      color: #333;
    }
    .attachment {
      margin-top: 15px;
      padding: 10px;
      background: #ffe5e0;
      border-radius: 6px;
      font-size: 15px;
    }
    .attachment a {
      color: #e5391d;
      text-decoration: none;
      font-weight: bold;
    }
    .attachment a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>🧠 AI ช่วยแก้ปัญหาให้คุณ</h2>
  
  <!-- Input for model name -->
  <input type="text" id="model-name" placeholder="กรุณากรอกชื่อรุ่น">
  
  <!-- Input for problem description -->
  <textarea id="question" placeholder="พิมพ์ปัญหาของคุณที่นี่..."></textarea>
  
  <!-- Submit button -->
  <button onclick="sendProblem()">ค้นหาวิธีแก้</button>

  <!-- Result area -->
  <div class="result" id="result" style="display:none;">
    <h3>✅ วิธีแก้ปัญหา:</h3>
    <p id="solution"></p>
    <div class="attachment" id="file-attachment" style="display:none;">
      📎 <span id="file-name"></span>
    </div>
  </div>

  <script>
    async function sendProblem() {
      const modelName = document.getElementById("model-name").value.trim();
      const question = document.getElementById("question").value.trim();

      if (!modelName || !question) {
        alert("กรุณากรอกชื่อรุ่นและปัญหาก่อน");
        return;
      }

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ modelName, question })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || "เกิดข้อผิดพลาด");
        }

        const data = await res.json();
        const resultBox = document.getElementById("result");
        const solutionText = document.getElementById("solution");
        const fileAttachment = document.getElementById("file-attachment");
        const fileNameSpan = document.getElementById("file-name");

        solutionText.innerText = data.solution;
        resultBox.style.display = "block";

        if (data.file) {
          fileAttachment.style.display = "block";
          fileNameSpan.innerHTML = `<a href="${data.file.url}" target="_blank">${data.file.name}</a>`;
        } else {
          fileAttachment.style.display = "none";
        }
      } catch (error) {
        alert("❗ " + error.message);
      }
    }
  </script>
</body>
</html>
